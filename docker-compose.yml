services:
  # MySQL Database container dedicated to Tractor ERP
  tractor-erp-db:
    image: mysql:8.0
    container_name: tractor_erp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${DB_NAME:-tractor_erp}
      MYSQL_USER: ${DB_USER:-tractor_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tractor_secure_pass_2026}
    volumes:
      - tractor_erp_mysql_data:/var/lib/mysql
    # Only expose to host if needed; keeps 3306 safe from colliding with other apps on the host
    ports:
      - "${DB_HOST_PORT:-3308}:3306"
    networks:
      - tractor_erp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tractor ERP Node.js Backend API
  tractor-erp-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tractor_erp_api
    restart: unless-stopped
    depends_on:
      tractor-erp-db:
        condition: service_healthy
    environment:
      PORT: 5003
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-tractor_user}:${DB_PASSWORD:-tractor_secure_pass_2026}@tractor-erp-db:3306/${DB_NAME:-tractor_erp}
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_jwt_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_to_a_long_random_jwt_refresh_secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Map host port 5003 to container port 5003 (change 5003 if your host already uses it)
      - "${API_PORT:-5003}:5003"
    networks:
      - tractor_erp_network

volumes:
  tractor_erp_mysql_data:
    name: tractor_erp_mysql_data

networks:
  tractor_erp_network:
    name: tractor_erp_network
    driver: bridge
