name: Tractor ERP – CI/CD Deploy to Oracle Instance

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ===============================================================
  # 1. Test & Build Validation Job
  # ===============================================================
  test-and-build:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck & Build
        working-directory: backend
        run: npm run build

      - name: Run Tests
        working-directory: backend
        run: npm test

  # ===============================================================
  # 2. Deploy to Oracle Instance via SSH + Docker Compose
  # ===============================================================
  deploy:
    name: Deploy to Oracle Instance
    runs-on: ubuntu-latest
    needs: test-and-build
    environment: gbg-secret-for-aws    # Required to access your Oracle/EC2 secrets

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 137.23.35.13
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="/home/ubuntu/tractor_app/tractor-spare-part-erp"
            echo "🚀 Starting Tractor ERP Deployment in: $APP_DIR"

            # 1. Ensure target directory exists and navigate to it
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # 2. Pull latest changes from main branch
            if [ -d ".git" ]; then
              echo "📥 Fetching latest code from main..."
              git fetch origin main
              git reset --hard origin/main
            else
              echo "📥 Cloning repository for initial setup..."
              git clone https://github.com/Patil-s-Software/tractor-spare-part-erp.git .
            fi

            # 3. Ensure production .env exists (never overwritten if already present)
            if [ ! -f ".env" ]; then
              echo "⚠️ No .env found! Creating default .env from .env.docker.example..."
              cp .env.docker.example .env
            fi

            # 4. Build and start containers in isolated Docker network
            echo "🐳 Building and starting Tractor ERP containers..."
            docker compose up -d --build --remove-orphans

            # 5. Verify backend health check
            echo "⏳ Checking backend service health..."
            ATTEMPTS=0
            PORT=$(grep -E '^API_PORT=' .env | cut -d '=' -f2 || echo "5003")
            PORT=${PORT:-5003}

            until curl -sf "http://127.0.0.1:$PORT/health" > /dev/null 2>&1; do
              ATTEMPTS=$((ATTEMPTS + 1))
              if [ $ATTEMPTS -ge 20 ]; then
                echo "❌ Health check failed on port $PORT after 60s!"
                docker compose logs --tail=50 tractor-erp-api
                exit 1
              fi
              sleep 3
            done

            # 6. Clean up old dangling Docker images to preserve VM disk space
            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Tractor ERP Deployment completed successfully on port $PORT!"
